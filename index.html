<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F5F4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D181B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario di un fumatore">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Diario di un fumatore</title>
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
html{color-scheme:light dark}
*{-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: una colonna stretta da telefono, navigazione in basso a quattro voci.
   Ogni sigaretta è disegnata come un bastoncino colorato in base all'importanza (1 scuro, 5 chiaro). */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface-2:#E7EEEC;
  --ink:#13262B; --ink-2:#47606A; --line:#D5DFDD; --line-strong:#9FB3B0;
  --accent:#0B7A69; --accent-ink:#FFFFFF; --accent-soft:#D2ECE6;
  --over:#B8204F; --filter:#D6B481;
  --r1:#7C2A0B; --r2:#B8481A; --r3:#DE7A33; --r4:#EBA06A; --r5:#F3C6A0;
  --r1t:#FFFFFF; --r2t:#FFFFFF; --r3t:#2A1206; --r4t:#2A1206; --r5t:#2A1206;
  --lung:#F4B6BC; --lung-edge:#D98A94; --smoke:#7D8394; --smoke-2:#A3A8B5;
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D181B; --surface:#152327; --surface-2:#1C2E33;
    --ink:#E4EEED; --ink-2:#9AB0B3; --line:#263A3F; --line-strong:#3F5A60;
    --accent:#3CC5AC; --accent-ink:#04201A; --accent-soft:#123A35;
    --over:#FF7FA3; --filter:#B89560;
    --r1:#FFB27A; --r2:#F0894E; --r3:#CC6A3E; --r4:#A0522F; --r5:#7A4026;
    --r1t:#1F0D03; --r2t:#1F0D03; --r3t:#1F0D03; --r4t:#FFF4EC; --r5t:#FFF4EC;
    --lung:#C9737F; --lung-edge:#E59AA5; --smoke:#C3C7D2; --smoke-2:#8E93A1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D181B; --surface:#152327; --surface-2:#1C2E33;
  --ink:#E4EEED; --ink-2:#9AB0B3; --line:#263A3F; --line-strong:#3F5A60;
  --accent:#3CC5AC; --accent-ink:#04201A; --accent-soft:#123A35;
  --over:#FF7FA3; --filter:#B89560;
  --r1:#FFB27A; --r2:#F0894E; --r3:#CC6A3E; --r4:#A0522F; --r5:#7A4026;
  --r1t:#1F0D03; --r2t:#1F0D03; --r3t:#1F0D03; --r4t:#FFF4EC; --r5t:#FFF4EC;
  --lung:#C9737F; --lung-edge:#E59AA5; --smoke:#C3C7D2; --smoke-2:#8E93A1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 15px/1.45 var(--font-body);
  padding-block:10px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
html.lock,html.lock body{overflow:hidden}
.wrap{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.05;font-weight:700}
h2{font-size:19px;line-height:1.15;font-weight:650}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 14px}
.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);color:var(--ink);padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13.5px}
.demo span{min-width:0}

/* Pulsanti */
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line-strong);background:transparent;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{border-color:var(--over);color:var(--over)}
.btn.danger.armed{background:var(--over);color:var(--surface)}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}

/* Oggi */
.today{padding:4px 0 6px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.num{font-family:var(--font-display);font-weight:800;font-size:92px;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cap{font-size:15px;color:var(--ink-2);font-weight:500}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 12px;min-height:46px}
.stick{width:12px;height:46px;border-radius:2px 2px 3px 3px;background:linear-gradient(to top,var(--filter) 0 24%,var(--c) 24% 100%)}
.stick.over{outline:2px solid var(--over);outline-offset:1px}
.slot{width:12px;height:46px;border-radius:2px 2px 3px 3px;border:1.5px dashed var(--line-strong)}
.status{font-weight:600}
.status.over{color:var(--over)}
.meta{color:var(--ink-2);font-size:14px;margin-top:2px}
.cta{margin:18px 0 6px;min-height:58px;font-size:17px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:6px}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px 1fr 34px;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.row .t{font-family:var(--font-mono);font-size:15px;font-variant-numeric:tabular-nums}
.row .p{min-width:0;overflow-wrap:anywhere}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.b1{background:var(--r1);color:var(--r1t)} .b2{background:var(--r2);color:var(--r2t)} .b3{background:var(--r3);color:var(--r3t)} .b4{background:var(--r4);color:var(--r4t)} .b5{background:var(--r5);color:var(--r5t)}
.empty{padding:22px 0;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:18px;margin-bottom:4px}
.setup{margin-top:24px;padding:16px;background:var(--surface);border-radius:12px}
.setup h2{margin-bottom:4px}
.setup p{color:var(--ink-2);font-size:14px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;color:var(--ink-2);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time]{
  width:100%;min-height:48px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line-strong);
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px;min-width:0}
.demo-cta{margin-top:14px}
.tag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:14px}
.kind button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--ink-2)}
.kind button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.qm{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qm .chip{min-height:40px;padding:0 14px}

/* Storico */
.day{border-bottom:1px solid var(--line)}
.day-head{display:grid;grid-template-columns:112px 1fr auto;align-items:center;gap:10px;width:100%;min-height:56px;background:none;border:0;text-align:left;padding:6px 0}
.day-head .dl{font-weight:600}
.day-head .dl small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px}
.mini{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;min-width:0}
.mini i{width:4px;height:20px;border-radius:1px;background:var(--c)}
.dc{font-family:var(--font-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.dc.zero{color:var(--accent)}
.day-body{padding:0 0 10px}
.day-body .row{border-bottom:1px solid var(--line)}
.day-body .row:last-child{border-bottom:0}

/* Analisi */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-strong);background:transparent;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-2);font:500 9.5px var(--font-mono)}
.chart .ax-b{fill:var(--ink);font:600 9.5px var(--font-mono)}
.chart .lim{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 3}
.chart .base{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:1.5 3}
.chart .zero{fill:var(--accent)}
.chart .seg{stroke:var(--bg);stroke-width:.8}
.chart .f1{fill:var(--r1)}.chart .f2{fill:var(--r2)}.chart .f3{fill:var(--r3)}.chart .f4{fill:var(--r4)}.chart .f5{fill:var(--r5)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend .sw{display:inline-block;width:18px;vertical-align:middle;margin-right:6px}
.sw.l{border-top:2px dashed var(--accent)}
.sw.b{border-top:2px dotted var(--ink-2)}
.sw.z{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ramp{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.ramp b{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;font-size:12px}
.ramp span{margin:0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:12px 10px 12px 0;min-width:0}
.stats div+div{padding-left:12px;border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink-2)}
.insights{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.insights li{padding-left:14px;border-left:3px solid var(--accent)}
.hrow{display:grid;grid-template-columns:minmax(78px,32%) 1fr 30px;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.hl{font-weight:600;min-width:0;overflow-wrap:anywhere}
.hl small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px}
.hb{display:flex;height:16px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hb i{display:block;height:100%;border-right:1px solid var(--bg)}
.hn{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}

/* Impostazioni */
.form{display:grid;gap:14px}
.help{font-size:13px;color:var(--ink-2)}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pchip{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 4px 0 14px;border-radius:999px;background:var(--surface-2)}
.pchip button{width:36px;height:36px;border:0;background:none;font-size:20px;line-height:1;color:var(--ink-2)}
.addp{display:grid;grid-template-columns:1fr auto;gap:8px}
.store{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.dot.off{background:var(--line-strong)}

/* Diario di un fumatore: schermata iniziale, polmoni, risparmio, diario, prodotti, backup */
.onb{padding-bottom:24px}
.onb h1{font-size:34px}
.onb .lead{color:var(--ink-2);margin:10px 0 0;font-size:16px}
.card{background:var(--surface);border-radius:14px;padding:16px;margin-top:16px}
.card h2{margin-bottom:4px}
.card>.help{margin:0 0 12px}
.prods{display:grid;gap:8px;margin:10px 0 12px}
.prod{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px}
.prod b{display:block;overflow-wrap:anywhere}
.prod small{color:var(--ink-2);font-size:13px;display:block}
.prod .pa{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prod .pa .btn{min-height:40px;padding:0 12px;font-size:14px}
.tag.main{background:var(--accent);color:var(--accent-ink)}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.kinds button{min-height:46px;border-radius:10px;border:1.5px solid var(--line-strong);background:transparent;font-weight:600}
.kinds button[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
select{width:100%;min-height:48px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;min-width:0}
textarea{width:100%;min-height:92px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;line-height:1.4;resize:vertical}
.panel .fld input{margin-top:0}
.pf{display:grid;gap:12px;margin-top:12px}
.lungs{margin-top:18px;background:var(--surface);border-radius:18px;padding:14px 14px 16px;text-align:center}
.lungs svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.lungs .lc{font-family:var(--font-display);font-weight:700;font-size:19px;margin-top:2px}
.lungs .ls{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.lg-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:10px auto 0;max-width:260px}
.lg-bar i{display:block;height:100%;background:var(--smoke);border-radius:999px}
@media (prefers-reduced-motion:no-preference){
  .wv{animation:wave 7s linear infinite}
  .wv2{animation:wave 11s linear infinite reverse}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50px)}}
}
.diary{display:grid;gap:12px;margin-top:8px}
.diary .help{margin:0}
.nn{display:block;color:var(--ink-2);font-size:12px;font-family:var(--font-mono)}
.btns{display:grid;gap:8px;margin-top:10px}
.note{padding:12px;border-radius:10px;background:var(--accent-soft);font-size:14px;margin-top:10px}
.chart .nb{fill:var(--accent)}
.chart .nbl{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:1.5 3}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);font-size:12.5px;font-weight:600}

.pro{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.lockcard{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px dashed var(--line-strong);background:transparent}
.lockcard b{display:block;font-family:var(--font-display);font-size:17px;margin-bottom:2px}
.lockcard span:not(.pro){color:var(--ink-2);font-size:14px}
.perks{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.perks li{padding-left:14px;border-left:3px solid var(--accent)}

/* Palette di colori extra (versione Pro): si attivano con data-palette sull'elemento html */
:root[data-palette="tramonto"]{--bg:#F6F1EF;--surface:#FDFCFC;--surface-2:#EBE3E0;--ink:#271811;--ink-2:#634E45;--line:#DED3CF;--line-strong:#967E73;--accent:#B8471E;--accent-ink:#FFFFFF;--accent-soft:#F1DCD5;--r1:#5D2713;--r1t:#FFFFFF;--r2:#98401F;--r2t:#FFFFFF;--r3:#C35128;--r3t:#FFFFFF;--r4:#E28E6F;--r4t:#251109;--r5:#EFC3B3;--r5t:#251109;}
@media (prefers-color-scheme: dark){:root[data-palette="tramonto"]:not([data-theme="light"]){--bg:#1A120F;--surface:#261C17;--surface-2:#322520;--ink:#F3EBE8;--ink-2:#BDAEA8;--line:#40312B;--line-strong:#82695E;--accent:#D67551;--accent-ink:#1D0D07;--accent-soft:#42281F;--r1:#EBBEAD;--r1t:#210F08;--r2:#DC9074;--r2t:#210F08;--r3:#CE623B;--r3t:#210F08;--r4:#A34929;--r4t:#FFFFFF;--r5:#7A371F;--r5t:#FFFFFF;}}

function loadLocal(){

    if(j){ state.days = j.days||{}; state.notes = j.notes||{}; state.settings = fixSettings(Object.assign(defaultSettings(), j.settings||{})); }
  }catch(e){}
}

  try{ localStorage.setItem(LS_KEY, JSON.stringify({days:state.days,notes:state.notes,settings:state.settings})); }catch(e){}
  scheduleDrive();

}
function enqueue(key, fn){
  chains[key] = (chains[key]||Promise.resolve()).then(fn).catch(function(err){
    console.error(err);
    toast('Salvataggio nel cloud non riuscito. I dati restano su questo dispositivo.');
  });
}
function persistDay(date){
  saveLocal();
  if(!col) return;
  enqueue('day-'+date, function(){
    var entries = state.days[date]||[], note = state.notes[date]||null;
    var ref = col.doc('day-'+date);
    if(!entries.length && !note) return ref.delete();
    var o = {date:date,entries:entries,updated:Date.now()};
    if(note) o.note = note;
    return ref.set(o);
  });
}
function persistSettings(){
  saveLocal();
  if(!col) return;
  enqueue('settings', function(){
    return col.doc('settings').set(Object.assign({}, state.settings, {updated:Date.now()}));
  });
}
function allDates(){
  return Object.keys(state.days).concat(Object.keys(state.notes)).filter(function(d,i,a){ return a.indexOf(d)===i; }).sort();
}
function applySnapshot(snap){
  if(snap.empty && snap.metadata && snap.metadata.fromCache) return;
  state.loading = false;
  var days = {}, notes = {}, st = null, bk = {meta:null,chunks:{}};
  snap.docs.forEach(function(d){
    var v = d.data(); if(!v) return;
    if(d.id==='settings') st = v;
    else if(d.id==='backup-meta') bk.meta = v;
    else if(d.id.indexOf('bk-')===0) bk.chunks[d.id] = v;
    else if(d.id.indexOf('day-')===0 && v.date){
      if(Array.isArray(v.entries) && v.entries.length) days[v.date] = v.entries;
      if(v.note && (v.note.i || v.note.d)) notes[v.date] = {i:v.note.i||'',d:v.note.d||''};
    }
  });
  state.backup = bk;
  if(snap.empty && !(snap.metadata && snap.metadata.fromCache)){
    // primo uso del cloud: porta su i dati salvati in precedenza solo sul dispositivo
    var local = allDates();
    if(local.length || state.settings.onboarded){ local.forEach(persistDay); persistSettings(); renderAll(); return; }
  }
  var ae = document.activeElement, fd = (ae && ae.dataset && ae.dataset.note) ? ae.dataset.date : null;
  if(fd){ if(state.notes[fd]) notes[fd] = state.notes[fd]; else delete notes[fd]; }
  state.days = days; state.notes = notes;
  if(st){
    var s = Object.assign(defaultSettings(), st); delete s.updated;
    if(state.settings.onboarded) s.onboarded = true;
    state.settings = fixSettings(s);
  }
  saveLocal();
  if(fd){ state.pendingRender = true; return; }
  renderAll();
}

function rangeDates(n){

  var start = ymd(addDays(new Date(),-(n-1)));
  if(first && first>start) start = first;
  for(var d=parseYmd(start); ymd(d)<=today; d=addDays(d,1)) out.push(ymd(d));
  return out;
}
function collect(dates,vape){

}

function dur(mins){
  if(mins<60) return mins+' min';
  var h=Math.floor(mins/60), m=mins%60;
  if(h<24) return m ? h+' h '+m+' min' : h+' h';
  return Math.floor(h/24)+' g '+(h%24)+' h';
}
function sinceText(){

  var hh = l.t.split(':').map(Number), dt = parseYmd(l.d); dt.setHours(hh[0],hh[1],0,0);
  var mins = Math.max(0, Math.round((Date.now()-dt.getTime())/60000));

  var when = l.d===today ? '' : (l.d===yest ? 'ieri ' : fmtShort.format(parseYmd(l.d))+' ');
  return 'Ultima sigaretta '+when+l.t+' · '+dur(mins)+' fa';

function unitCost(S){

function savedTotal(){
  var S=D().settings, c=unitCost(S);

function stackedChart(groups,o){
  var W=340,H=o.h||176,L=24,R=6,T=12,B=22, iw=W-L-R, ih=H-T-B, n=groups.length, bw=iw/n, w=Math.max(2,bw*0.68);
  var totals = groups.map(function(g){ return sum(g.c); });
  var max = Math.max.apply(null,[4].concat(totals,[o.limit||0,o.baseline||0])); max = Math.ceil(max/2)*2;
  var y = function(v){ return T+ih-(v/max)*ih; };
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
  [0,max/2,max].forEach(function(v){
    s += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(L-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';
  });
  groups.forEach(function(g,i){
    var x = L+i*bw+(bw-w)/2, base=0;
    g.c.forEach(function(c,k){
      if(!c) return;
      var top = y(base+c), h = y(base)-top;
      s += '<rect class="seg f'+(k+1)+'" x="'+x.toFixed(2)+'" y="'+top.toFixed(2)+'" width="'+w.toFixed(2)+'" height="'+h.toFixed(2)+'"/>';
      base += c;
    });
    if(o.zeroMarks && base===0) s += '<circle class="zero" cx="'+(x+w/2).toFixed(2)+'" cy="'+(y(0)-4)+'" r="'+Math.min(3,w/2+.5).toFixed(1)+'"/>';
    if(o.labelAt(i)) s += '<text class="'+(o.boldLast&&i===n-1?'ax-b':'ax')+'" x="'+(x+w/2).toFixed(2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(g.label)+'</text>';
  });
  if(o.baseline) s += '<line class="base" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.baseline)+'" y2="'+y(o.baseline)+'"/>';
  if(o.limit) s += '<line class="lim" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.limit)+'" y2="'+y(o.limit)+'"/>';
  return s+'</svg>';
}
function barChart(vals,labels,o){
  var W=340,H=140,L=28,R=6,T=10,B=22, iw=W-L-R, ih=H-T-B, n=vals.length, bw=iw/n, w=Math.max(2,bw*0.68);
  var max = Math.max.apply(null,[1].concat(vals,[o.ref||0])); max = Math.ceil(max);
  var y = function(v){ return T+ih-(v/max)*ih; };

function viewAnalisi(){

  var h = demoBanner()+'<header class="top"><div><p class="eyebrow">Come sta andando</p><h1>Analisi</h1></div></header>';
  if(!first) return h+'<div class="empty"><b>Servono alcune registrazioni</b>Dopo qualche giorno qui vedrai l\'andamento, le ore e i luoghi più critici.</div>'+demoCta();
  var n=proLocked()?7:state.range, dates=rangeDates(n), list=collect(dates), total=list.length, avg=dates.length?total/dates.length:0;
  var zeroDays = dates.filter(function(d){ return !(D().days[d]||[]).filter(isCig).length; }).length;
  h += '<div class="chips" role="group" aria-label="Periodo">'+[7,14,30,90].map(function(v){

    return '<button class="chip'+(v===n?' on':'')+'" data-act="setRange" data-n="'+v+'" aria-pressed="'+(v===n)+'">'+v+' giorni</button>';

  var groups = dates.map(function(d){ return {label:String(parseYmd(d).getDate()), c:by5((D().days[d]||[]).filter(isCig))}; });
  var every = n<=14?1:(n<=30?5:15), len=groups.length;
  h += '<section class="sec"><h2>Sigarette al giorno</h2>'+
    stackedChart(groups,{aria:'Sigarette fumate ogni giorno negli ultimi '+n+' giorni',limit:S.limit,baseline:S.baseline,zeroMarks:true,boldLast:true,
      labelAt:function(i){ return (len-1-i)%every===0; }})+
    '<div class="legend">'+(S.limit?'<span><i class="sw l"></i>limite '+S.limit+'</span>':'')+(S.baseline?'<span><i class="sw b"></i>prima: '+S.baseline+'</span>':'')+'<span><i class="sw z"></i>giorno senza</span></div>'+ramp()+'</section>';

  var vl=collect(dates,true);
  if(vl.length){
    var vm=sum(vl.map(function(e){ return e.m; }));
    h += '<section class="sec"><h2>Svapo</h2><div class="stats"><div><b>'+vm+'</b><span>minuti</span></div><div><b>'+vl.length+'</b><span>sessioni</span></div><div><b>'+nf1.format(vm/dates.length)+'</b><span>minuti al giorno</span></div></div></section>';
  }

  } else if(nics.some(function(x){ return x!=null; })){
    var nv = nics.map(function(x){ return x||0; }), navg = sum(nv)/dates.length, bn = baseNic(S);
    var vari = bn ? Math.round((navg/bn-1)*100) : null;
    var every2 = n<=14?1:(n<=30?5:15), len2 = nv.length;
    h += '<section class="sec"><h2>Nicotina</h2><div class="stats"><div><b>'+nf2.format(navg)+'</b><span>mg al giorno</span></div>'+
      '<div><b>'+(bn!=null?nf1.format(bn):'—')+'</b><span>mg al giorno prima</span></div>'+
      '<div><b>'+(vari!==null?(vari>0?'+':'')+vari+'%':'—')+'</b><span>rispetto a prima</span></div></div>'+
      barChart(nv, dates.map(function(d){ return String(parseYmd(d).getDate()); }), {ref:bn, aria:'Nicotina stimata ogni giorno negli ultimi '+n+' giorni', labelAt:function(i){ return (len2-1-i)%every2===0; }})+
      '<p class="help" style="margin-top:6px">Stima: nicotina dichiarata sull\'etichetta del prodotto per ogni sigaretta registrata. La quantità che il corpo assorbe davvero può essere più alta.</p></section>';
  }

  // insight

    if(low>0) ins.push(Math.round(low/total*100)+'% delle sigarette è di importanza 4 o 5. Sono le più facili da togliere per prime.');
    var hours=[]; for(var i=0;i<24;i++) hours.push([0,0,0,0,0]);
    list.forEach(function(e){ var hh=parseInt(e.t.slice(0,2),10); if(e.r>=1&&e.r<=5) hours[hh][e.r-1]++; });
    var ph=0; hours.forEach(function(c,i){ if(sum(c)>sum(hours[ph])) ph=i; });
    ins.push('Fascia più a rischio: '+pad(ph)+':00–'+pad((ph+1)%24)+':00, con '+sum(hours[ph])+' sigarette.');
    var pl={}; list.forEach(function(e){ (pl[e.p]=pl[e.p]||[]).push(e.r); });
    var tp=Object.keys(pl).sort(function(a,b){ return pl[b].length-pl[a].length; })[0];
    var avgR=sum(pl[tp])/pl[tp].length;
    ins.push('Luogo principale: '+tp+', '+pl[tp].length+' sigarette, importanza media '+nf1.format(avgR)+' su 5.');
  }
  var td=ymd(new Date()), f=firstDate();
  if(f && f<=ymd(addDays(new Date(),-13))){

    ins.push('Ultimi 7 giorni: '+nf1.format(ca)+' al giorno, '+(Math.abs(df)<0.05?'come i':nf1.format(Math.abs(df))+(df<0?' in meno rispetto ai':' in più rispetto ai'))+' 7 precedenti.');
  }

    : '<section class="sec"><h2>Cosa emerge</h2><ul class="insights">'+ins.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('')+'</ul></section>';

  // ore

  list.forEach(function(e){ var hh=parseInt(e.t.slice(0,2),10); if(e.r>=1&&e.r<=5) hg[hh].c[e.r-1]++; });
  h += proLocked() ? lockCard('A che ora','Le fasce della giornata in cui fumi di più.')
    : '<section class="sec"><h2>A che ora</h2>'+stackedChart(hg,{aria:'Sigarette per ora del giorno',h:150,labelAt:function(i){ return i%3===0; }})+'</section>';

  // luoghi
  var pm={}; list.forEach(function(e){ var c=pm[e.p]||(pm[e.p]={c:[0,0,0,0,0],n:0,s:0}); if(e.r>=1&&e.r<=5) c.c[e.r-1]++; c.n++; c.s+=e.r; });
  var pk=Object.keys(pm).sort(function(a,b){ return pm[b].n-pm[a].n; });

  }

  // importanza
  var imax=Math.max.apply(null,c5.concat([1]));
  h += '<section class="sec"><h2>Quanto contavano</h2><div class="list">'+[0,1,2,3,4].map(function(i){
    var cc=[0,0,0,0,0]; cc[i]=c5[i];
    return hrow((i+1)+' · '+LABELS[i], total?Math.round(c5[i]/total*100)+'%':'', cc, imax);
  }).join('')+'</div></section>';
  return h;
}

  if(s.kind==='v'){ entry.k='v'; entry.m=Math.round(+s.m); }
  else {
    var pr = prodById(state.settings,s.pr), old = null;
    if(!pr || pr.k==='e') pr = mainProd(state.settings);
    if(s.mode==='edit') old = (state.days[s.date0]||[]).filter(function(x){ return x.id===s.id; })[0]||null;

/* ---------- backup e ripristino ---------- */
function numOrNull(x){ return (typeof x==='number' && isFinite(x)) ? x : null; }
function cleanProducts(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(function(p){ return p && typeof p==='object' && ['c','h','t','e'].indexOf(p.k)>=0; }).map(function(p){
    return {id:String(p.id||newId()).slice(0,40),k:p.k,brand:String(p.brand||'').slice(0,40),variant:String(p.variant||'').slice(0,40),
            nic:numOrNull(p.nic),price:numOrNull(p.price),size:numOrNull(p.size)};
  });
}
function cleanData(raw){
  if(!raw || typeof raw!=='object' || !raw.days || typeof raw.days!=='object') return null;
  var days={}, notes={}, count=0;
  Object.keys(raw.days).forEach(function(d){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !Array.isArray(raw.days[d])) return;
    var es=raw.days[d].filter(function(e){
      return e && typeof e.t==='string' && /^\d{2}:\d{2}$/.test(e.t) && typeof e.p==='string' && e.r>=1 && e.r<=5;
    }).map(function(e){
      var o={id:String(e.id||newId()).slice(0,40),t:e.t,p:e.p.slice(0,40),r:Math.round(e.r)};
      if(e.k==='v'||e.k==='h'||e.k==='t') o.k=e.k;
      if(e.k==='v') o.m=Math.max(0,Math.round(+e.m)||0);
      if(typeof e.n==='number' && isFinite(e.n)) o.n=e.n;
      if(typeof e.pr==='string') o.pr=e.pr.slice(0,40);
      return o;
    });
    if(es.length){ days[d]=es; count+=es.length; }
  });
  var src=(raw.notes && typeof raw.notes==='object') ? raw.notes : {};
  Object.keys(src).forEach(function(d){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !src[d] || typeof src[d]!=='object') return;
    var i=String(src[d].i||'').slice(0,2000), dd=String(src[d].d||'').slice(0,2000);
    if(i.trim()||dd.trim()) notes[d]={i:i,d:dd};
  });
  var r=(raw.settings && typeof raw.settings==='object') ? raw.settings : {};
  var st=fixSettings({first:String(r.first||'').slice(0,40),last:String(r.last||'').slice(0,40),onboarded:!!r.onboarded,
    baseline:numOrNull(r.baseline),limit:numOrNull(r.limit),packPrice:null,packSize:20,products:cleanProducts(r.products),
    mainId:typeof r.mainId==='string'?r.mainId:null,
    plan:(r.plan && typeof r.plan==='object') ? {on:!!r.plan.on,start:String(r.plan.start||'').slice(0,10),from:numOrNull(r.plan.from),
      step:numOrNull(r.plan.step)||1,every:numOrNull(r.plan.every)||7,target:numOrNull(r.plan.target)||0} : null,
    places:Array.isArray(r.places)?r.places.filter(function(x){ return typeof x==='string' && x.trim(); }).map(function(x){ return x.slice(0,24); }):[]});
  return {days:days,notes:notes,settings:st,count:count};
}
function applyRestore(data){
  var cur=state.settings, oldDates=allDates();
  var st=data.settings;
  if(cur.onboarded) st.onboarded=true;
  if(!st.first) st.first=cur.first;
  if(!st.last) st.last=cur.last;
  state.days=data.days; state.notes=data.notes; state.settings=st;
  var all=oldDates.concat(allDates()).filter(function(d,i,a){ return a.indexOf(d)===i; });
  all.forEach(persistDay); persistSettings();
  renderAll(); toast('Dati ripristinati');
}

/* piano di riduzione */
function planDays(p){ return Math.max(0, Math.round((parseYmd(ymd(new Date()))-parseYmd(p.start))/86400000)); }
function planLimit(p){ return Math.max(p.target, p.from - Math.floor(planDays(p)/p.every)*p.step); }
function applyPlan(){
  var S=state.settings, p=S.plan;
  if(!p || !p.on || !S.onboarded || !/^\d{4}-\d{2}-\d{2}$/.test(p.start||'')) return;
  var l=planLimit(p);
  if(S.limit!==l){ S.limit=l; persistSettings(); renderAll(); }
}
function planHtml(S){
  var h='<section class="sec"><h2>Piano di riduzione'+(proLocked()?'<span class="pro">PRO</span>':'')+'</h2>';

  var p=S.plan;
  if(p && p.on){
    var days=planDays(p), next=p.every-(days%p.every), done=S.limit!=null && S.limit<=p.target;
    return h+'<p class="meta" style="margin:4px 0 10px">Il limite scende di '+p.step+' ogni '+p.every+(p.every===1?' giorno':' giorni')+', fino a '+p.target+'. Limite di oggi: <b>'+(S.limit==null?'—':S.limit)+'</b>'+
      (done?'. Obiettivo raggiunto.':'. Prossima riduzione tra '+next+(next===1?' giorno.':' giorni.'))+'</p><button class="btn block" data-act="planOff">Disattiva il piano</button></section>';
  }
  var from = S.limit!=null ? S.limit : (S.baseline!=null ? S.baseline : '');

    '<div class="two"><label class="fld"><span>Parti da (al giorno)</span><input type="number" id="pl-from" inputmode="numeric" min="1" max="99" value="'+esc(from)+'"></label>'+
    '<label class="fld"><span>Fino a</span><input type="number" id="pl-target" inputmode="numeric" min="0" max="99" value="0"></label></div>'+

  }catch(e){}
}

function riskHour(){
  var cutoff=ymd(addDays(new Date(),-29)), c=[], total=0, i;
  for(i=0;i<24;i++) c.push(0);
  Object.keys(state.days).forEach(function(d){
    if(d<cutoff) return;
    state.days[d].forEach(function(e){ if(isVape(e)) return; var h=parseInt(e.t.slice(0,2),10); if(h>=0&&h<24){ c[h]++; total++; } });
  });
  if(total<10) return null;
  var best=0; c.forEach(function(v,h){ if(v>c[best]) best=h; });
  return best;
}

    state.onb=null; persistSettings(); renderAll(); window.scrollTo(0,0); toast('Benvenuto, '+S.first);
  },
  pickMode:function(el){ state.look.mode=el.dataset.m; saveLook(); applyLook(); renderView(); },
  pickPalette:function(el){
    var id=el.dataset.p;
    if(id!=='salvia' && proLocked()){ openPaywall(); return; }
    state.look.palette=id; saveLook(); applyLook(); renderView();
  },
  remindDiary:function(){
    if(proLocked()){ openPaywall(); return; }
    state.remind.diary.on=!state.remind.diary.on; if(state.remind.diary.on) ensureNotif();
    saveRemind(); syncReminders(); renderView();
  },
  remindRisk:function(){
    if(proLocked()){ openPaywall(); return; }
    state.remind.risk.on=!state.remind.risk.on; if(state.remind.risk.on) ensureNotif();
    saveRemind(); syncReminders(); renderView();
  },
  paywall:function(){ openPaywall(); },
  buyPro:function(){ nCall('buy'); },
  restorePro:function(){ nCall('restorePurchases'); toast('Controllo gli acquisti…'); },
  driveConnect:function(){ if(proLocked()){ openPaywall(); return; } nCall('driveConnect'); },
  driveRestoreStart:function(){ if(state.drive.connected) nCall('driveFetch'); else nCall('driveConnect'); },
  driveNow:function(){ driveUpload(true); toast('Salvo su Drive…'); },
  driveAuto:function(){ state.drive.auto=!state.drive.auto; saveDrive(); renderView(); },
  driveRestore:function(){ nCall('driveFetch'); },
  driveOff:function(){ state.drive.connected=false; saveDrive(); clearTimeout(driveTimer); driveTimer=null; renderView(); toast('Drive scollegato'); },
  planOn:function(){
    if(guardDemo() || proLocked()) return;
    var f=parseNum($('#pl-from').value), t=parseNum($('#pl-target').value), st=parseNum($('#pl-step').value), ev=parseNum($('#pl-every').value);
    if(f.err||t.err||st.err||ev.err||f.v===null||st.v===null||st.v<1||ev.v===null||ev.v<1){ toast('Controlla i numeri del piano.'); return; }
    var tg = t.v===null ? 0 : t.v;
    if(tg>=f.v){ toast('L\'obiettivo deve essere più basso del punto di partenza.'); return; }
    state.settings.plan={on:true,start:ymd(new Date()),from:f.v,step:st.v,every:ev.v,target:tg};
    state.settings.limit=f.v; persistSettings(); applyPlan(); renderAll(); toast('Piano attivato');
  },
  planOff:function(){ state.settings.plan=null; persistSettings(); renderView(); toast('Piano disattivato'); },
  closeSheet:function(){ closeSheet(); },
  pickPlace:function(el){ sheet.pi=+el.dataset.i; sheet.other=false; renderSheet(); },
  pickOther:function(){ sheet.other=true; sheet.pi=null; renderSheet(); },
  pickKind:function(el){ sheet.kind=el.dataset.k; renderSheet(); },
  pickMin:function(el){ sheet.m=el.dataset.v; renderSheet(); },
  pickR:function(el){
    sheet.r=+el.dataset.r;
    document.querySelectorAll('.sc').forEach(function(b){ b.setAttribute('aria-checked', String(+b.dataset.r===sheet.r)); });
    $('#f-hint').textContent=HINTS[sheet.r-1]; updateSave();
  },
  saveSheet:function(){ saveSheet(); },
  delEntry:function(){
    if(!sheet.armed){ sheet.armed=true; renderSheet(); return; }
    var d0=sheet.date0; removeEntry(d0,sheet.id); persistDay(d0);
    closeSheet(); renderAll(); toast('Voce eliminata');
  }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var fn=actions[el.dataset.act]; if(fn) fn(el,e);
});

function noteInput(t){
  if(state.demo) return;
  var d=t.dataset.date, k=t.dataset.note, nt=Object.assign({i:'',d:''}, state.notes[d]||{});
  nt[k]=t.value.slice(0,2000);
  if(!nt.i.trim() && !nt.d.trim()) delete state.notes[d]; else state.notes[d]=nt;
  clearTimeout(noteTimers[d]);
  noteTimers[d]=setTimeout(function(){ noteTimers[d]=null; persistDay(d); },700);
}
function flushNote(d){
  if(noteTimers[d]){ clearTimeout(noteTimers[d]); noteTimers[d]=null; persistDay(d); }
}
function onbInput(t){
  var o=state.onb; if(!o) return;
  if(t.id==='o-first') o.first=t.value; else if(t.id==='o-last') o.last=t.value;
  else if(t.id==='o-base') o.baseline=t.value; else if(t.id==='o-lim') o.limit=t.value;
  updateOnb();
}
function prodInput(t){
  var s=psheet; if(!s) return;
  if(t.id==='p-bt') s.bt=t.value; else if(t.id==='p-vt') s.vt=t.value;
  else if(t.id==='p-nic') s.nic=t.value; else if(t.id==='p-price') s.price=t.value; else if(t.id==='p-size') s.size=t.value;
  else return;
  updateProdSave();
}
function prodSelect(t){
  var s=psheet; if(!s) return;
  if(t.dataset.psel==='brand'){
    if(t.value==='__other'){ s.other=true; s.brand=''; s.variant=''; s.nic=''; }
    else { s.other=false; s.brand=t.value; s.variant=''; s.nic=''; }
  } else {
    s.variant=t.value;
    var f=(CIG_DB[s.brand]||[]).filter(function(v){ return v[0]===t.value; })[0];
    s.nic = f ? String(f[1]).replace('.',',') : '';
  }
  renderProd();
}
function readBackupFile(t){
  var f=t.files && t.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var c=cleanData(JSON.parse(String(fr.result)));
      if(!c) throw new Error('formato');
      state.restore={data:c,label:'file '+f.name,count:c.count,dayN:Object.keys(c.days).length};
      renderView();
    }catch(err){ toast('File non valido.'); }
  };
  fr.onerror=function(){ toast('Non riesco a leggere il file.'); };
  fr.readAsText(f); t.value='';
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset && t.dataset.note){ noteInput(t); return; }
  if(t.id && t.id.indexOf('o-')===0){ onbInput(t); return; }
  if(psheet){ prodInput(t); return; }
  if(!sheet) return;
  if(t.id==='f-date') sheet.date=t.value;
  else if(t.id==='f-time') sheet.t=t.value;
  else if(t.id==='f-other') sheet.custom=t.value;
  else if(t.id==='f-min') sheet.m=t.value;
  else return;
  updateSave();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset && t.dataset.set) saveSetting(t);
  else if(t.dataset && t.dataset.psel) prodSelect(t);
  else if(t.dataset && t.dataset.note) flushNote(t.dataset.date);
  else if(t.id==='rf') readBackupFile(t);
  else if(t.id==='rm-t'){
    if(/^\d{2}:\d{2}$/.test(t.value)){ state.remind.diary.t=t.value; saveRemind(); syncReminders(); toast('Ora salvata'); }
  }
});
document.addEventListener('focusout',function(e){
  var t=e.target;
  if(t.dataset && t.dataset.note){
    flushNote(t.dataset.date);
    if(state.pendingRender){ state.pendingRender=false; setTimeout(renderAll,400); }
  }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && (sheet||psheet||state.pw)) closeSheet(); });

setInterval(function(){
  var el=$('#since'); if(el && !sheet) el.textContent=sinceText();
},30000);

/* ---------- avvio ---------- */
loadDrive();
if(nCall('isPro')===true) state.pro=true;
loadLook(); loadRemind(); applyLook();
function webSaver(){
  return {save:function(o){
    var file=null;
    try{ file=new File([o.data],o.filename,{type:o.filename.slice(-5)==='.json'?'application/json':'text/csv'}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:o.filename}).then(function(){ return {status:'saved'}; })
        .catch(function(e){ throw {code:(e && e.name==='AbortError')?'declined':'unavailable'}; });
    }
    try{
      var a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([o.data],{type:o.filename.slice(-5)==='.json'?'application/json':'text/csv'}));
      a.download=o.filename; document.body.appendChild(a); a.click(); a.remove();
      return Promise.resolve({status:'saved'});
    }catch(e){ return Promise.reject({code:'unavailable'}); }
  }};
}
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
loadLocal();
renderAll();
applyPlan();
setInterval(applyPlan,600000);
syncReminders();
if(window.claude && window.claude.use && !state.settings.onboarded){
  state.loading=true; renderAll();
  setTimeout(function(){ if(state.loading){ state.loading=false; renderAll(); } },5000);
}
(async function(){
  try{
    if(!window.claude || !window.claude.use){ dl=webSaver(); renderAll(); return; }
    var user = await window.claude.use('user');
    var db = await window.claude.use('db');
    var uid = user ? await user.id() : null;
    if(db && uid){
      col = db.collection('data/users/'+uid);
      state.mode='cloud';
      col.onSnapshot(applySnapshot,function(err){
        console.error(err); col=null; state.mode='local'; state.loading=false; renderAll();
      });
    } else { state.loading=false; }
    dl = await window.claude.use('downloads');
    renderAll();
  }catch(err){ console.error(err); state.loading=false; renderAll(); }
})();
})();
</script>
